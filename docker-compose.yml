# Wersja DYSTRYBUCYJNA: gotowe obrazy z rejestru, bez budowania ze zrodel.
# Pobierasz ten plik + Caddyfile + .env, uruchamiasz `docker compose up -d`
# i przechodzisz kreator w przegladarce. Do pracy nad kodem sluzy infra/docker-compose.yml.
#
# MTM_VERSION przypnij do konkretnej wersji (np. 0.6.8) — `latest` moze sie zmienic
# w srodku tygodnia i zaskoczyc migracja bazy.
services:
  wireguard:
    image: ${MTM_IMAGE:-ghcr.io/zaba44/mikrotik-manager}-wireguard:${MTM_VERSION:-latest}
    container_name: mtm-wireguard
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      - WG_INTERFACE=${WG_INTERFACE:-wg-mt}
      - WG_PORT=${WG_PORT:-51820}
      - WG_SERVER_IP=${WG_SERVER_IP:-}
      - WG_AGENT_TOKEN=${WG_AGENT_TOKEN:-}
      - BACKUP_SFTP_PORT=${BACKUP_SFTP_PORT:-2222}
      - SYSLOG_PORT=${SYSLOG_PORT:-5514}
      - CADDY_PORT=${CADDY_PORT:-8443}
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    volumes:
      - wg_data:/etc/wireguard
      - agent_secret:/data/agent
    networks:
      - internal
    restart: unless-stopped

  backend:
    image: ${MTM_IMAGE:-ghcr.io/zaba44/mikrotik-manager}-backend:${MTM_VERSION:-latest}
    container_name: mtm-backend
    cap_add:
      - NET_ADMIN
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mtm}:${POSTGRES_PASSWORD:-mtm}@postgres:5432/${POSTGRES_DB:-mtm}
      - FERNET_KEY=${FERNET_KEY:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - WG_SUBNET=${WG_SUBNET:-}
      - WG_SERVER_IP=${WG_SERVER_IP:-}
      - WG_PORT=${WG_PORT:-51820}
      - WG_SERVER_PUBLIC_KEY=${WG_SERVER_PUBLIC_KEY:-}
      - HUB_ENDPOINT=${HUB_ENDPOINT:-}
      - WG_AGENT_TOKEN=${WG_AGENT_TOKEN:-}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-60}
      - BACKUP_SFTP_PASSWORD=${BACKUP_SFTP_PASSWORD:-}
      - BACKUP_SFTP_PORT=${BACKUP_SFTP_PORT:-2222}
      - SYSLOG_PORT=${SYSLOG_PORT:-5514}
      - BACKUP_UPLOAD_TIMEOUT_SECONDS=${BACKUP_UPLOAD_TIMEOUT_SECONDS:-120}
    depends_on:
      - postgres
      - wireguard
    volumes:
      - backup_data:/data/backups
      - secret_data:/data/secrets
      - tls_data:/data/tls
      - agent_secret:/data/agent
    networks:
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mtm-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mtm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mtm}
      - POSTGRES_DB=${POSTGRES_DB:-mtm}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: mtm-caddy
    environment:
      - CADDY_PORT=${CADDY_PORT:-8443}
      - HUB_ENDPOINT=${HUB_ENDPOINT:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/certs:ro
      - caddy_data:/data
    ports:
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_PORT:-8443}:${CADDY_PORT:-8443}"
    depends_on:
      - backend
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  wg_data:
  tls_data:
  agent_secret:
  pg_data:
  caddy_data:
  backup_data:
  secret_data:
