<div id="locations-list">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <section class="panel">
        <div class="table-wrap">
            <table>
                <thead><tr><th>Nazwa</th><th>Notatki</th></tr></thead>
                <tbody>
                    {% for location in locations %}
                    <tr>
                        <td><a href="/locations/{{ location.id }}">{{ location.name }}</a></td>
                        <td style="white-space:normal;">{{ location.notes or "—" }}</td>
                    </tr>
                    {% else %}
                    <tr><td colspan="2" class="empty">Brak lokalizacji.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>
</div>
